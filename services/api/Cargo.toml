[package]
name = "youzhihui-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
redis = { version = "=0.28.2", default-features = false, features = ["tokio-comp", "aio"] }
salvo = { version = "=0.80.0", features = ["test", "affix-state", "matched-path", "websocket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.149"
sqlx = { version = "=0.8.6", default-features = false, features = ["mysql", "runtime-tokio", "migrate", "macros", "json"] }
tokio = { version = "=1.52.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.23.1", features = ["v4"] }


argon2 = "0.5"
hmac = "=0.12.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.4.3"
chrono = "=0.4.44"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rpassword = "7"
lopdf = { version = "0.46.0", default-features = false }
futures-util = { version = "0.3.34", features = ["sink"] }
