name: youzhihui-restore412
services:
  mysql:
    image: mysql:8.4
    restart: 'no'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes: ['mysql-data:/var/lib/mysql']
    mem_limit: 768m
    command: ['--innodb-buffer-pool-size=192M', '--max-connections=40', '--mysqlx=OFF']
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u $$MYSQL_USER -D $$MYSQL_DATABASE -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7-alpine
    restart: 'no'
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '64mb', '--maxmemory-policy', 'noeviction']
    volumes: ['redis-data:/data']
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: 'no'
    command: ['--model-id', 'BAAI/bge-small-zh-v1.5', '--revision', '7999e1d3359715c523056ef9478215996d62a620', '--port', '80']
    volumes: ['embedding-cache:/data']
    mem_limit: 1200m
    cpus: '1.0'
  api:
    image: ${API_IMAGE:?}
    restart: 'no'
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?}
      TRUSTED_PROXY_KEY: ${TRUSTED_PROXY_KEY:?}
      WEB_ORIGIN: http://localhost:18103
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/
      AI_ENABLED: 'false'
      AI_EMBEDDING_URL: http://embedding:80
      API_BIND: 0.0.0.0:8080
      UPLOAD_ROOT: /data/uploads
      DEV_TOOLS_ENABLED: 'false'
      COOKIE_SECURE: 'false'
      RUST_LOG: info,sqlx::query=error
    volumes: ['uploads:/data/uploads']
    mem_limit: 512m
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health/ready']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    image: ${WEB_IMAGE:?}
    restart: 'no'
    mem_limit: 512m
    depends_on: [api]
  edge:
    image: nginx:alpine
    restart: 'no'
    mem_limit: 64m
    ports: ['127.0.0.1:18103:80']
    environment:
      TRUSTED_PROXY_KEY: ${TRUSTED_PROXY_KEY:?}
      NGINX_ENVSUBST_FILTER: TRUSTED_PROXY_KEY
    volumes: ['./nginx.411.conf:/etc/nginx/templates/default.conf.template:ro']
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
volumes:
  mysql-data:
  redis-data:
  uploads:
  embedding-cache:
