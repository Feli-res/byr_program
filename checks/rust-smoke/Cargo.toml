[package]
name = "byr-environment-check"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
redis = { version = "=0.28.2", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
salvo = { version = "=0.80.0", features = ["test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.149"
sqlx = { version = "=0.8.6", default-features = false, features = ["mysql", "runtime-tokio"] }
tokio = { version = "=1.52.1", features = ["macros", "rt-multi-thread"] }
toml = "=0.8.23"
